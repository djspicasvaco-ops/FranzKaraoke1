<!DOCTYPE html>

<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FranzKaraoke</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#000;--bg2:#141414;--bg3:#1c1c1e;--bg4:#2c2c2e;
--text:#fff;--text2:rgba(255,255,255,0.6);--text3:rgba(255,255,255,0.35);
--accent:#fc3c44;--accent2:#ff6b6b;--gold:#f5a623;--success:#30d158;
--r:12px;--r-lg:18px;--r-xl:24px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;position:relative;background:var(--bg)}
.topbar{padding:16px 20px 8px;flex-shrink:0;z-index:10}
.topbar-inner{display:flex;justify-content:space-between;align-items:center}
.topbar-logo{font-size:22px;font-weight:800;letter-spacing:-0.03em;color:var(--text)}
.topbar-logo span{color:var(--accent)}
.topbar-admin{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:none;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.searchbar{padding:8px 20px 12px;flex-shrink:0}
.search-inner{display:flex;align-items:center;gap:10px;background:var(--bg3);border-radius:var(--r);padding:9px 14px}
.search-inner svg{flex-shrink:0;opacity:0.4}
.search-inner input{background:transparent;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;width:100%}
.search-inner input::placeholder{color:var(--text3)}
.tabs{display:flex;gap:8px;padding:4px 20px 12px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 16px;border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;letter-spacing:-0.01em}
.tab-active{background:var(--text);color:#000}
.tab-inactive{background:var(--bg3);color:var(--text2)}
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 20px 100px}
.scroll-area::-webkit-scrollbar{display:none}
.artist-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.artist-card{cursor:pointer;border-radius:var(--r-lg);overflow:hidden;position:relative;aspect-ratio:1;transition:transform 0.15s}
.artist-card:active{transform:scale(0.96)}
.artist-cover{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.artist-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,rgba(0,0,0,0.1) 50%,transparent 100%)}
.artist-info{position:absolute;bottom:0;left:0;right:0;padding:14px 12px;z-index:1}
.artist-info-name{font-size:15px;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
.artist-info-count{font-size:12px;color:rgba(255,255,255,0.65);margin-top:2px}
.song-list-item{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:0.5px solid rgba(255,255,255,0.06);cursor:pointer;border-radius:8px}
.song-list-item:last-child{border-bottom:none}
.song-list-item:active{background:rgba(255,255,255,0.05)}
.song-num{width:22px;text-align:right;font-size:14px;color:var(--text3);font-weight:500;flex-shrink:0}
.song-thumb{width:44px;height:44px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;position:relative;overflow:hidden}
.song-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.song-thumb-txt{position:relative;z-index:1}
.song-meta{flex:1;min-width:0}
.song-name{font-size:15px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:13px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-preview-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.song-preview-btn.playing{background:var(--accent);color:#fff}
.song-add{width:28px;height:28px;border-radius:50%;background:transparent;border:none;color:var(--text3);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.song-add:active{color:var(--accent)}
/* SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet-overlay.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--bg2);border-radius:28px 28px 0 0;z-index:51;transition:transform 0.38s cubic-bezier(0.32,0.72,0,1);max-height:90dvh;display:flex;flex-direction:column}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:12px auto 0}
.sheet-header{padding:16px 20px 0;flex-shrink:0}
.sheet-artist-hero{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sheet-artist-avatar{width:64px;height:64px;border-radius:var(--r);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;overflow:hidden;position:relative}
.sheet-artist-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheet-artist-avatar-txt{position:relative;z-index:1}
.sheet-artist-name{font-size:22px;font-weight:800;letter-spacing:-0.03em}
.sheet-artist-sub{font-size:14px;color:var(--text2);margin-top:2px}
.sheet-songs{flex:1;overflow-y:auto;padding:0 20px 40px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sheet-songs::-webkit-scrollbar{display:none}
.sheet-song-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:0.5px solid rgba(255,255,255,0.07);cursor:pointer}
.sheet-song-row:last-child{border-bottom:none}
.sheet-song-num{width:20px;text-align:center;font-size:14px;color:var(--text3);flex-shrink:0}
.sheet-song-title{font-size:15px;font-weight:500;flex:1;letter-spacing:-0.01em}
.sheet-preview-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sheet-preview-btn.playing{background:var(--accent);color:#fff}
.sheet-song-btn{padding:7px 14px;border-radius:100px;background:rgba(255,255,255,0.1);border:none;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.sheet-song-btn:active{background:var(--accent)}
/* RESERVE */
.reserve-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--bg2);border-radius:28px 28px 0 0;z-index:60;transition:transform 0.38s cubic-bezier(0.32,0.72,0,1);padding:12px 20px 48px}
.reserve-sheet.show{transform:translateX(-50%) translateY(0)}
.rs-handle{width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0 auto 20px}
.rs-preview{display:flex;align-items:center;gap:14px;background:var(--bg3);border-radius:var(--r-lg);padding:14px;margin-bottom:20px}
.rs-preview-thumb{width:52px;height:52px;border-radius:var(--r);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;overflow:hidden;position:relative}
.rs-preview-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rs-preview-thumb-txt{position:relative;z-index:1}
.rs-song{font-size:16px;font-weight:700;letter-spacing:-0.02em}
.rs-artist{font-size:14px;color:var(--text2);margin-top:2px}
.rs-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;letter-spacing:0.02em;text-transform:uppercase}
.rs-input{width:100%;background:var(--bg3);border:none;border-radius:var(--r);padding:14px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:17px;font-weight:500;outline:none;margin-bottom:16px;-webkit-appearance:none}
.rs-input::placeholder{color:var(--text3)}
.rs-btn{width:100%;padding:16px;border:none;border-radius:var(--r-lg);background:var(--accent);color:#fff;font-family:'Inter',sans-serif;font-size:17px;font-weight:700;cursor:pointer;transition:opacity 0.15s}
.rs-btn:active{opacity:0.85}
.rs-err{color:var(--accent2);font-size:13px;margin-bottom:10px;display:none}
/* CONFIRM */
.confirm-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;transform:translateY(100%);transition:transform 0.4s cubic-bezier(0.32,0.72,0,1)}
.confirm-screen.show{transform:translateY(0)}
.confirm-icon-wrap{width:100px;height:100px;border-radius:50%;background:rgba(48,209,88,0.15);display:flex;align-items:center;justify-content:center;margin-bottom:28px}
.confirm-check{font-size:48px}
.confirm-label{font-size:15px;font-weight:600;color:var(--text2);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px}
.confirm-pos{font-size:96px;font-weight:900;letter-spacing:-0.05em;color:var(--text);line-height:1;margin-bottom:4px}
.confirm-pos-label{font-size:17px;color:var(--text2);margin-bottom:32px}
.confirm-song-card{background:var(--bg3);border-radius:var(--r-xl);padding:18px 20px;width:100%;margin-bottom:32px;display:flex;align-items:center;gap:16px}
.confirm-song-thumb{width:56px;height:56px;border-radius:var(--r);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;overflow:hidden;position:relative}
.confirm-song-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.confirm-song-name{font-size:17px;font-weight:700;letter-spacing:-0.02em}
.confirm-song-artist{font-size:14px;color:var(--text2);margin-top:3px}
.confirm-msg{font-size:15px;color:var(--text2);text-align:center;margin-bottom:32px;line-height:1.5}
.confirm-close{width:100%;padding:16px;border:none;border-radius:var(--r-lg);background:var(--bg3);color:var(--text);font-family:'Inter',sans-serif;font-size:17px;font-weight:600;cursor:pointer;margin-bottom:12px}
.confirm-another{width:100%;padding:16px;border:none;border-radius:var(--r-lg);background:transparent;color:var(--accent);font-family:'Inter',sans-serif;font-size:17px;font-weight:600;cursor:pointer}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(0,0,0,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(255,255,255,0.08);padding:10px 0 24px;z-index:40;display:flex;justify-content:space-around}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 20px;cursor:pointer;border:none;background:transparent;color:var(--text3);transition:color 0.15s;font-family:'Inter',sans-serif}
.bnav-item.active{color:var(--accent)}
.bnav-icon{font-size:22px;line-height:1}
.bnav-label{font-size:10px;font-weight:500;letter-spacing:0.02em}
/* QUEUE */
.queue-view{padding-top:8px}
.q-live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(252,60,68,0.15);border:1px solid rgba(252,60,68,0.3);border-radius:100px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:20px}
.q-live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.q-card{display:flex;align-items:center;gap:14px;background:var(--bg2);border-radius:var(--r-lg);padding:14px;margin-bottom:10px}
.q-pos{font-size:28px;font-weight:900;letter-spacing:-0.04em;color:var(--text3);width:36px;text-align:center;flex-shrink:0}
.q-pos.first{color:var(--gold)}
.q-thumb{width:48px;height:48px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;overflow:hidden;position:relative}
.q-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.q-info{flex:1;min-width:0}
.q-who{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.q-what{font-size:13px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-empty{text-align:center;padding:60px 0}
.q-empty-icon{font-size:56px;opacity:0.2;display:block;margin-bottom:14px}
.q-empty-text{color:var(--text3);font-size:16px;font-weight:500}
/* SEARCH RESULTS */
.search-loading{text-align:center;padding:40px;color:var(--text3);font-size:14px}
.search-section{font-size:13px;font-weight:600;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin:16px 0 10px}
/* MINI PLAYER */
.mini-player{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;background:var(--bg3);border-radius:var(--r-lg);padding:12px 14px;z-index:39;display:none;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
.mini-player.show{display:flex}
.mini-player-thumb{width:40px;height:40px;border-radius:8px;flex-shrink:0;overflow:hidden;position:relative}
.mini-player-thumb img{width:100%;height:100%;object-fit:cover}
.mini-player-info{flex:1;min-width:0}
.mini-player-song{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-player-artist{font-size:12px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-play-btn{width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-stop-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* ADMIN */
.admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);z-index:200;display:none;flex-direction:column}
.admin-overlay.show{display:flex}
.admin-inner{flex:1;overflow-y:auto;padding:60px 20px 40px;max-width:430px;width:100%;margin:0 auto}
.admin-close-btn{position:fixed;top:20px;right:20px;width:34px;height:34px;border-radius:50%;background:var(--bg3);border:none;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:201}
.admin-title{font-size:28px;font-weight:800;letter-spacing:-0.03em;margin-bottom:24px}
.admin-stat-row{display:flex;gap:10px;margin-bottom:24px}
.admin-stat{flex:1;background:var(--bg2);border-radius:var(--r-lg);padding:16px}
.admin-stat-n{font-size:32px;font-weight:900;letter-spacing:-0.04em}
.admin-stat-l{font-size:12px;color:var(--text2);margin-top:2px;font-weight:500}
.admin-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.admin-btn{padding:9px 16px;border-radius:100px;border:none;background:var(--bg3);color:var(--text2);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.admin-btn-red{background:rgba(252,60,68,0.15);color:var(--accent)}
.acard{background:var(--bg2);border-radius:var(--r-lg);padding:14px;margin-bottom:10px;transition:opacity 0.2s}
.acard.done,.acard.skip{opacity:0.35}
.acard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.acard-left{flex:1;min-width:0;display:flex;gap:10px;align-items:center}
.acard-thumb{width:44px;height:44px;border-radius:8px;flex-shrink:0;overflow:hidden;position:relative}
.acard-thumb img{width:100%;height:100%;object-fit:cover}
.acard-thumb-txt{width:44px;height:44px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.acard-text{flex:1;min-width:0}
.acard-pos{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:3px}
.acard-name{font-size:15px;font-weight:700;letter-spacing:-0.01em}
.acard-song{font-size:13px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard-btns{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.ac-btn{padding:5px 12px;border-radius:100px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none}
.ac-btn-ok{background:rgba(48,209,88,0.15);color:var(--success)}
.ac-btn-sk{background:rgba(245,166,35,0.15);color:var(--gold)}
.ac-btn-up{background:var(--bg3);color:var(--text2)}
.ac-btn-rm{background:rgba(252,60,68,0.12);color:var(--accent)}
.abadge{display:inline-block;font-size:10px;padding:3px 8px;border-radius:100px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;margin-left:6px}
.abadge-q{background:rgba(255,255,255,0.08);color:var(--text2)}
.abadge-ok{background:rgba(48,209,88,0.15);color:var(--success)}
.abadge-sk{background:rgba(245,166,35,0.15);color:var(--gold)}
.lock-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:0 20px}
.lock-emoji{font-size:52px;margin-bottom:16px;opacity:0.25}
.lock-title{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
.lock-sub{color:var(--text2);font-size:15px;margin-bottom:28px}
.lock-input{width:100%;padding:14px 18px;background:var(--bg2);border:none;border-radius:var(--r-lg);color:var(--text);font-family:'Inter',sans-serif;font-size:17px;font-weight:500;outline:none;margin-bottom:12px;-webkit-appearance:none}
.lock-btn{width:100%;padding:16px;border:none;border-radius:var(--r-lg);background:var(--accent);color:#fff;font-family:'Inter',sans-serif;font-size:17px;font-weight:700;cursor:pointer}
.lock-hint{font-size:13px;color:var(--text3);margin-top:14px}
.pw-row{display:none;margin-bottom:14px}
.pw-row-inner{display:flex;gap:8px}
.pw-row-inner input{flex:1;padding:10px 14px;background:var(--bg2);border:none;border-radius:var(--r);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;outline:none;-webkit-appearance:none}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
<div class="topbar-inner">
<div class="topbar-logo">Franz<span>Karaoke</span></div>
<button class="topbar-admin" onclick="openAdmin()">⚙️</button>
</div>
</div>
<div class="searchbar">
<div class="search-inner">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
<input id="gsearch" type="text" placeholder="Pretraži Spotify ili katalogu..." oninput="onSearch()">
</div>
</div>
<div class="tabs" id="tabs">
<button class="tab tab-active" onclick="switchTab('artists',this)">Izvođači</button>
<button class="tab tab-inactive" onclick="switchTab('songs',this)">Sve pjesme</button>
<button class="tab tab-inactive" onclick="switchTab('queue',this)">Red čekanja</button>
</div>
<div class="scroll-area" id="scroll-area"></div>
</div>

<!-- MINI PLAYER -->

<div class="mini-player" id="mini-player">
<div class="mini-player-thumb"><img id="mini-img" src="" alt=""></div>
<div class="mini-player-info">
<div class="mini-player-song" id="mini-song"></div>
<div class="mini-player-artist" id="mini-artist"></div>
</div>
<button class="mini-stop-btn" onclick="stopPreview()">■</button>
</div>

<!-- ARTIST SHEET -->

<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
<div class="sheet-handle"></div>
<div class="sheet-header">
<div class="sheet-artist-hero">
<div class="sheet-artist-avatar" id="sheet-avatar"></div>
<div>
<div class="sheet-artist-name" id="sheet-name"></div>
<div class="sheet-artist-sub" id="sheet-sub"></div>
</div>
</div>
</div>
<div class="sheet-songs" id="sheet-songs"></div>
</div>

<!-- RESERVE SHEET -->

// Use iTunes Search API with CORS proxy fallback
async function searchItunes(query) {
const term = encodeURIComponent(query);
const endpoints = [
'https://itunes.apple.com/search?term=' + term + '&media=music&limit=20&entity=song',
'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://itunes.apple.com/search?term=' + term + '&media=music&limit=20&entity=song'),
];
for (const url of endpoints) {
try {
const r = await fetch(url);
if (!r.ok) continue;
const d = await r.json();
if (!d.results) continue;
return d.results.map(t => ({
id: 'itunes_' + t.trackId,
song: t.trackName,
artist: t.artistName,
album: t.collectionName,
img: (t.artworkUrl100 || '').replace('100x100', '300x300'),
preview: t.previewUrl || null,
source: 'itunes'
}));
} catch(e) { continue; }
}
return [];
}

function getPalette(str){let h=0;for(let c of str)h=(h*31+c.charCodeAt(0))&0xffffffff;return PALETTES[Math.abs(h)%PALETTES.length];}
function initials(name){return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}

// ── AUDIO PREVIEW ──────────────────────────────────────────
let audio = null, currentPreviewId = null;
function playPreview(id, url, song, artist, img) {
if (!url) return;
if (currentPreviewId === id) { stopPreview(); return; }
stopPreview();
audio = new Audio();
audio.volume = 0.8;
audio.src = proxyAudio(url);
currentPreviewId = id;
document.querySelectorAll('.song-preview-btn,.sheet-preview-btn').forEach(b => {
b.classList.toggle('playing', b.dataset.id === id);
b.textContent = b.dataset.id === id ? '■' : '▶';
});
const mp = document.getElementById('mini-player');
mp.classList.add('show');
document.getElementById('mini-song').textContent = song;
document.getElementById('mini-artist').textContent = artist;
const mi = document.getElementById('mini-img');
mi.src = img || '';
mi.style.display = img ? 'block' : 'none';
audio.onended = stopPreview;
audio.onerror = stopPreview;
const playPromise = audio.play();
if (playPromise !== undefined) { playPromise.catch(() => { stopPreview(); }); }
}
function stopPreview() {
if (audio) { audio.pause(); audio = null; }
currentPreviewId = null;
document.querySelectorAll('.song-preview-btn,.sheet-preview-btn').forEach(b => { b.classList.remove('playing'); b.textContent = '▶'; });
document.getElementById('mini-player').classList.remove('show');
}

function proxyAudio(url){
if(!url)return null;
// iTunes preview URLs end in .m4a — proxy them for mobile CORS
return 'https://corsproxy.io/?' + encodeURIComponent(url);
}
let currentTab='artists', queue=[], adminOk=false, adminPw='karaoke';
let pendingSong=null, pendingArtist=null, pendingImg=null, pendingPreview=null, pendingColor=null, pendingColor2=null;

// ── PERSISTENCE (jsonblob.com — free, no signup, cross-device) ─
// On first reservation a blob is created and its ID stored in localStorage.
// All devices that share the same Netlify URL load/poll this blob.
// To share across devices: the FIRST device to make a reservation creates
// the blob; subsequent devices on same session share via localStorage key.
// For truly shared multi-device: hardcode BLOB_ID after first reservation
// (the ID is logged to console).
const BLOB_BASE = 'https://jsonblob.com/api/jsonBlob';

async function saveQueue(){
try{localStorage.setItem('fk_queue',JSON.stringify(queue));localStorage.setItem('fk_pw',adminPw);}catch(e){}
try{
const blobId=localStorage.getItem('fk_blob');
const payload=JSON.stringify({queue,pw:adminPw});
if(!blobId){
const r=await fetch(BLOB_BASE,{
method:'POST',
headers:{'Content-Type':'application/json','Accept':'application/json'},
body:payload
});
// jsonblob returns the ID in the Location header
const loc=r.headers.get('Location');
if(loc){
const id=loc.split('/').pop();
localStorage.setItem('fk_blob',id);
location.hash = id;
console.log('FranzKaraoke blob ID:',id,'— share this URL with admin:',location.href);
}
} else {
await fetch(BLOB_BASE+'/'+blobId,{
method:'PUT',
headers:{'Content-Type':'application/json','Accept':'application/json'},
body:payload
});
}
}catch(e){console.warn('Cloud save failed',e);}
}

async function loadFromCloud(){
try{
const blobId=localStorage.getItem('fk_blob')||HARDCODED_BLOB_ID;
if(!blobId)return false;
if(!localStorage.getItem('fk_blob'))localStorage.setItem('fk_blob',blobId);
const r=await fetch(BLOB_BASE+'/'+blobId,{headers:{'Accept':'application/json'}});
if(!r.ok)return false;
const d=await r.json();
if(d&&d.queue){
queue=d.queue;
if(d.pw)adminPw=d.pw;
try{localStorage.setItem('fk_queue',JSON.stringify(queue));}catch(e){}
return true;
}
}catch(e){}
return false;
}

// Blob ID can come from: URL hash (#blobid), localStorage, or hardcoded below
const HARDCODED_BLOB_ID = null;
// Read from URL hash if present (e.g. https://yoursite.netlify.app/#1234567890)
const URL_BLOB_ID = location.hash.replace('#','').trim() || null;
if(URL_BLOB_ID && !localStorage.getItem('fk_blob')) localStorage.setItem('fk_blob', URL_BLOB_ID);

function loadQueue(){
try{const q=localStorage.getItem('fk_queue');if(q)queue=JSON.parse(q);const p=localStorage.getItem('fk_pw');if(p)adminPw=p;}catch(e){}
}
function refreshUI(){
document.getElementById('s-queue').textContent=queue.filter(e=>e.status==='queue').length;
if(currentTab==='queue')renderTab('queue');
if(adminOk){renderAQ();updateAStats();}
}

loadQueue();
loadFromCloud().then(ok=>{if(ok)refreshUI();});
setInterval(async()=>{const ok=await loadFromCloud();if(ok)refreshUI();},5000);

function renderTab(tab,filter){
const area=document.getElementById('scroll-area');
area.scrollTop=0;
if(tab==='queue'){renderQueue(area);return;}
const q=filter||'';
if(q){renderSongs(area,CATALOG.filter(c=>c.a.toLowerCase().includes(q)||c.s.toLowerCase().includes(q)),q);return;}

html+='<div class="artist-card" onclick="openSheet(\''+esc(artist)+'\')">'
+'<div class="artist-cover" style="background:linear-gradient(145deg,'+c1+','+c2+')">'
+'<span style="position:relative;z-index:1;font-size:42px;letter-spacing:-0.03em;color:rgba(255,255,255,0.22)">'+ini+'</span>'
+'</div>'
+'<div class="artist-info"><div class="artist-info-name">'+artist+'</div>'
+'<div class="artist-info-count">'+songs.length+' '+(songs.length===1?'pjesma':'pjesme/a')+'</div></div>'
+'</div>';
});
html+='</div>';area.innerHTML=html;
}

function renderSongs(area,items,filter){
let html='';
items.forEach((c,i)=>{
const [c1,c2]=getPalette(c.a);const ini=initials(c.a);
const hl=(t,q)=>q?t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark style="background:rgba(252,60,68,0.3);color:var(--text);border-radius:2px">$1</mark>'):t;
html+='<div class="song-list-item">'
+'<div class="song-num">'+(i+1)+'</div>'
+'<div class="song-thumb" style="background:linear-gradient(135deg,'+c1+','+c2+')">'
+'<span class="song-thumb-txt" style="color:rgba(255,255,255,0.85)">'+ini+'</span></div>'
+'<div class="song-meta" onclick="openReserve(\''+esc(c.s)+'\',\''+esc(c.a)+'\',null,null)">'
+'<div class="song-name">'+hl(c.s,filter)+'</div>'
+'<div class="song-artist">'+hl(c.a,filter)+'</div></div>'
+'<button class="song-add" onclick="openReserve(\''+esc(c.s)+'\',\''+esc(c.a)+'\',null,null)">+</button>'
+'</div>';
});
area.innerHTML=html||'<div style="text-align:center;padding:60px 0;color:var(--text3);font-size:15px">Nema rezultata u katalogu</div>';
}

// ── SEARCH ─────────────────────────────────────────────────
function onSearch(){
const q=document.getElementById('gsearch').value.trim().toLowerCase();
clearTimeout(searchTimer);
if(!q){renderTab(currentTab);return;}
// Show local results immediately
const localMatches=CATALOG.filter(c=>c.a.toLowerCase().includes(q)||c.s.toLowerCase().includes(q));
const area=document.getElementById('scroll-area');
let html='';
if(localMatches.length){
html+='<div class="search-section">Iz kataloga</div>';
localMatches.slice(0,5).forEach((c,i)=>{
const [c1,c2]=getPalette(c.a);const ini=initials(c.a);
html+='<div class="song-list-item">'
+'<div class="song-num">'+(i+1)+'</div>'
+'<div class="song-thumb" style="background:linear-gradient(135deg,'+c1+','+c2+')">'
+'<span class="song-thumb-txt" style="color:rgba(255,255,255,0.85)">'+ini+'</span></div>'
+'<div class="song-meta" onclick="openReserve(\''+esc(c.s)+'\',\''+esc(c.a)+'\',null,null)">'
+'<div class="song-name">'+c.s+'</div><div class="song-artist">'+c.a+'</div></div>'
+'<button class="song-add" onclick="openReserve(\''+esc(c.s)+'\',\''+esc(c.a)+'\',null,null)">+</button>'
+'</div>';
});
}
html+='<div class="search-section">S interneta <span style="color:var(--text3);font-weight:400;font-size:11px">— pretraži bilo što</span></div>'
+'<div id="itunes-results"><div class="search-loading">Pretraži...</div></div>';
area.innerHTML=html;
// Debounce iTunes search
doItunesSearch(q);
}

async function doItunesSearch(q){
const el=document.getElementById('itunes-results');
if(!el)return;
el.innerHTML='<div class="search-loading">Učitavam...</div>';
const results=await searchItunes(q);
if(!el)return;
if(!results.length){el.innerHTML='<div class="search-loading">Nema rezultata</div>';return;}
let html='';
results.forEach((r,i)=>{
const [c1,c2]=getPalette(r.artist);
html+='<div class="song-list-item">'
+'<div class="song-num">'+(i+1)+'</div>'
+'<div class="song-thumb" style="background:linear-gradient(135deg,'+c1+','+c2+')">'
+(r.img?'<img src="'+r.img+'" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">':'')
+'<span class="song-thumb-txt" style="color:rgba(255,255,255,0.85);'+(r.img?'display:none':'')+'">'+initials(r.artist)+'</span></div>'
+'<div class="song-meta" onclick="openReserve(\''+esc(r.song)+'\',\''+esc(r.artist)+'\',\''+esc(r.img||'')+'\',\''+esc(r.preview||'')+'\')">'
+'<div class="song-name">'+r.song+'</div><div class="song-artist">'+r.artist+'</div></div>'
+(r.preview?'<button class="song-preview-btn" data-id="'+r.id+'" onclick="playPreview(\''+r.id+'\',\''+esc(r.preview)+'\',\''+esc(r.song)+'\',\''+esc(r.artist)+'\',\''+esc(r.img||'')+'\')">▶</button>':'')
+'<button class="song-add" onclick="openReserve(\''+esc(r.song)+'\',\''+esc(r.artist)+'\',\''+esc(r.img||'')+'\',\''+esc(r.preview||'')+'\')" style="margin-left:4px">+</button>'
+'</div>';
});
el.innerHTML=html;
}

// ── ARTIST SHEET ───────────────────────────────────────────
async function openSheet(artist){
const songs=CATALOG.filter(c=>c.a===artist).map(c=>c.s);
const [c1,c2]=getPalette(artist);const ini=initials(artist);
const av=document.getElementById('sheet-avatar');
av.style.cssText='background:linear-gradient(135deg,'+c1+','+c2+');width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:rgba(255,255,255,0.85)';
av.innerHTML='<span class="sheet-artist-avatar-txt">'+ini+'</span>';
document.getElementById('sheet-name').textContent=artist;
document.getElementById('sheet-sub').textContent=songs.length+' '+(songs.length===1?'pjesma':'pjesme/a')+' u katalogu';
let html='';
songs.forEach((s,i)=>{
html+='<div class="sheet-song-row">'
+'<div class="sheet-song-num">'+(i+1)+'</div>'
+'<div class="sheet-song-title" onclick="openReserve(\''+esc(s)+'\',\''+esc(artist)+'\',null,null);closeSheet()">'+s+'</div>'
+'<button class="sheet-song-btn" onclick="openReserve(\''+esc(s)+'\',\''+esc(artist)+'\',null,null);closeSheet()">+ Rezerviraj</button>'
+'</div>';
});
document.getElementById('sheet-songs').innerHTML=html;
document.getElementById('sheet-overlay').classList.add('show');
document.getElementById('sheet').classList.add('show');
// Fetch iTunes preview for artist image + per-song previews
try {
const res=await searchItunes(artist+' '+songs[0]);
const artistImg=res.find(r=>r.img);
if(artistImg){
av.style.cssText='width:64px;height:64px;border-radius:12px;overflow:hidden;position:relative';
av.innerHTML='<img src="'+artistImg.img+'" style="width:100%;height:100%;object-fit:cover"><span class="sheet-artist-avatar-txt" style="display:none">'+ini+'</span>';
}
const rows=document.querySelectorAll('.sheet-song-row');
const addPreviewBtn=(row,i,s,previewUrl,imgUrl)=>{
if(!row||row.querySelector('.sheet-preview-btn'))return;
const btn=document.createElement('button');
btn.className='sheet-preview-btn';btn.dataset.id='sheet_'+i;btn.textContent='▶';
btn.onclick=()=>playPreview('sheet_'+i,previewUrl,s,artist,imgUrl||'');
row.insertBefore(btn,row.querySelector('.sheet-song-btn'));
};
rows.forEach((row,i)=>{
const s=songs[i];
const match=res.find(r=>r.preview&&(r.song.toLowerCase()===s.toLowerCase()||r.song.toLowerCase().includes(s.toLowerCase().split(' ')[0])||s.toLowerCase().includes(r.song.toLowerCase().split(' ')[0])));
if(match&&match.preview)addPreviewBtn(row,i,s,match.preview,match.img||'');
});
const missingIdxs=[...rows].map((_,i)=>i).filter(i=>!rows[i].querySelector('.sheet-preview-btn'));
for(const i of missingIdxs){
const s=songs[i];
try{
const r2=await searchItunes(artist+' '+s);
const m=r2.find(r=>r.preview);
if(m&&m.preview)addPreviewBtn(rows[i],i,s,m.preview,m.img||'');
}catch(e){}
await new Promise(res=>setTimeout(res,80));
}
} catch(e){}
}
function closeSheet(){document.getElementById('sheet-overlay').classList.remove('show');document.getElementById('sheet').classList.remove('show');}

// ── RESERVE ────────────────────────────────────────────────
async function openReserve(song,artist,img,preview){
pendingSong=song;pendingArtist=artist;pendingImg=img||null;pendingPreview=preview||null;
const [c1,c2]=getPalette(artist);pendingColor=c1;pendingColor2=c2;
const ini=initials(artist);
let thumbContent=img?'<img src="'+img+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">'+'':'';
thumbContent+='<span class="rs-preview-thumb-txt" style="position:relative;z-index:1;color:rgba(255,255,255,0.85);'+(img?'display:none':'')+'">'+''+ini+'</span>';
document.getElementById('rs-preview').innerHTML='<div class="rs-preview-thumb" style="background:linear-gradient(135deg,'+c1+','+c2+')">'+thumbContent+'</div><div style="flex:1;min-width:0"><div class="rs-song">'+song+'</div><div class="rs-artist">'+artist+'</div></div><div id="rs-preview-btn-wrap"></div>';
document.getElementById('rs-err').style.display='none';
document.getElementById('rs-overlay').classList.add('show');
document.getElementById('rs').classList.add('show');
setTimeout(()=>document.getElementById('rs-name').focus(),350);
// Auto-fetch preview if not provided
if(!preview){
try{
const results=await searchItunes(song+' '+artist);
const match=results.find(r=>r.preview&&(r.song.toLowerCase().includes(song.toLowerCase().split(' ')[0])||r.artist.toLowerCase().includes(artist.toLowerCase().split(' ')[0])));
if(match){
pendingPreview=match.preview;
if(match.img&&!pendingImg){
pendingImg=match.img;
const thumb=document.querySelector('.rs-preview-thumb');
if(thumb){thumb.style.background='none';thumb.innerHTML='<img src="'+match.img+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">';}
}
const wrap=document.getElementById('rs-preview-btn-wrap');
if(wrap){wrap.innerHTML='<button onclick="playPreview(\'rs\',\''+match.preview+'\',\''+esc(song)+'\',\''+esc(artist)+'\',\''+esc(match.img||'')+'\');event.stopPropagation()" style="padding:6px 14px;border-radius:100px;background:rgba(255,255,255,0.1);border:none;color:var(--text);font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">▶ Preview</button>';}
}
}catch(e){}
} else {
const wrap=document.getElementById('rs-preview-btn-wrap');
if(wrap){wrap.innerHTML='<button onclick="playPreview(\'rs\',\''+esc(preview)+'\',\''+esc(song)+'\',\''+esc(artist)+'\',\''+esc(img||'')+'\');event.stopPropagation()" style="padding:6px 14px;border-radius:100px;background:rgba(255,255,255,0.1);border:none;color:var(--text);font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">▶ Preview</button>';}
}
}
function closeRS(){document.getElementById('rs-overlay').classList.remove('show');document.getElementById('rs').classList.remove('show');}

function submitRes(){
const name=document.getElementById('rs-name').value.trim();
const err=document.getElementById('rs-err');
if(!name){err.style.display='block';return;}
err.style.display='none';
stopPreview();
const entry={id:Date.now(),name,song:pendingSong,artist:pendingArtist,img:pendingImg,color:pendingColor,color2:pendingColor2,status:'queue'};
queue.push(entry);
saveQueue();
const pos=queue.filter(e=>e.status==='queue').indexOf(entry)+1;
document.getElementById('conf-pos').textContent=pos;
document.getElementById('conf-song').textContent=pendingSong;
document.getElementById('conf-artist').textContent=pendingArtist;
const ct=document.getElementById('conf-thumb');
ct.style.cssText='width:56px;height:56px;border-radius:12px;flex-shrink:0;overflow:hidden;position:relative;background:linear-gradient(135deg,'+pendingColor+','+pendingColor2+');display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:rgba(255,255,255,0.85)';
ct.innerHTML=pendingImg?'<img src="'+pendingImg+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">':initials(pendingArtist);
closeRS();
document.getElementById('conf-screen').classList.add('show');
document.getElementById('s-queue').textContent=queue.filter(e=>e.status==='queue').length;
if(adminOk)renderAQ();
}
function closeConf(){document.getElementById('conf-screen').classList.remove('show');if(currentTab==='queue')renderTab('queue');}
function confAnother(){document.getElementById('conf-screen').classList.remove('show');document.getElementById('rs-name').value='';if(currentTab==='queue')renderTab('queue');}

// ── QUEUE ──────────────────────────────────────────────────
function renderQueue(area){
const waiting=queue.filter(e=>e.status==='queue');
document.getElementById('s-queue').textContent=waiting.length;
let html='<div class="queue-view"><div class="q-live-badge"><span class="q-live-dot"></span>'+waiting.length+' čeka u redu</div>';
if(!waiting.length){
html+='<div class="q-empty"><span class="q-empty-icon">🎤</span><div class="q-empty-text">Red je prazan.<br>Rezerviraj prvu pjesmu!</div></div>';
} else {
waiting.forEach(function(e,i){
var posClass=i===0?'q-pos first':'q-pos';
var bg='background:linear-gradient(135deg,'+(e.color||'#333')+','+(e.color2||'#555')+')';
var ini=initials(e.artist||e.song);
var what=e.song+(e.artist?' · '+e.artist:'');
var thumbImg=e.img?'<img src="'+e.img+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">':'';
html+='<div class="q-card">'
+'<div class="'+posClass+'">'+(i+1)+'</div>'
+'<div class="q-thumb" style="'+bg+';color:rgba(255,255,255,0.85)">'+thumbImg+(e.img?'':'<span style="position:relative;z-index:1">'+ini+'</span>')+'</div>'
+'<div class="q-info"><div class="q-who">'+e.name+'</div><div class="q-what">'+what+'</div></div>'
+'</div>';
});
}
html+='</div>';area.innerHTML=html;
}

// ── ADMIN ──────────────────────────────────────────────────
function openAdmin(){document.getElementById('admin-overlay').classList.add('show');}
function closeAdmin(){document.getElementById('admin-overlay').classList.remove('show');}
function checkPw(){
if(document.getElementById('apw').value===adminPw){
adminOk=true;document.getElementById('admin-lock').style.display='none';document.getElementById('admin-panel').style.display='block';document.getElementById('apw').value='';renderAQ();updateAStats();
}else{document.getElementById('pwerr').style.display='block';setTimeout(()=>document.getElementById('pwerr').style.display='none',2000);}
}
function lockAdmin(){adminOk=false;document.getElementById('admin-lock').style.display='block';document.getElementById('admin-panel').style.display='none';}
function savePw(){const np=document.getElementById('npw').value.trim();if(np.length<3){alert('Min 3 znaka');return;}adminPw=np;saveQueue();document.getElementById('pwrow').style.display='none';document.getElementById('npw').value='';}
function markDone(id){const e=queue.find(x=>x.id===id);if(e)e.status='done';saveQueue();renderAQ();updateAStats();}
function markSkip(id){const e=queue.find(x=>x.id===id);if(e)e.status='skip';saveQueue();renderAQ();updateAStats();}
function removeEntry(id){queue=queue.filter(x=>x.id!==id);saveQueue();renderAQ();updateAStats();}
function moveUp(id){const i=queue.findIndex(x=>x.id===id);if(i>0){[queue[i-1],queue[i]]=[queue[i],queue[i-1]];}saveQueue();renderAQ();}
function clearDone(){queue=queue.filter(e=>e.status==='queue');saveQueue();renderAQ();updateAStats();}
function updateAStats(){
const w=queue.filter(e=>e.status==='queue').length;
document.getElementById('as-w').textContent=w;
document.getElementById('as-d').textContent=queue.filter(e=>e.status==='done').length;
document.getElementById('as-t').textContent=queue.length;
document.getElementById('s-queue').textContent=w;
}
function renderAQ(){
if(!adminOk)return;
const el=document.getElementById('aq'),em=document.getElementById('ae');
if(!queue.length){el.innerHTML='';em.style.display='block';return;}
em.style.display='none';let qp=0;
el.innerHTML=queue.map((e,i)=>{
if(e.status==='queue')qp++;
const bc=e.status==='done'?'abadge-ok':e.status==='skip'?'abadge-sk':'abadge-q';
const bl=e.status==='done'?'Gotovo':e.status==='skip'?'Preskočen':'Čeka';
const upBtn=(e.status==='queue'&&i>0)?'<button class="ac-btn ac-btn-up" onclick="moveUp('+e.id+')">↑</button>':'';
const actionBtns=e.status==='queue'?'<button class="ac-btn ac-btn-ok" onclick="markDone('+e.id+')">✓</button><button class="ac-btn ac-btn-sk" onclick="markSkip('+e.id+')">Skip</button>'+upBtn:'';
const thumbHtmlAdmin=e.img
?'<div class="acard-thumb"><img src="'+e.img+'" alt=""></div>'
:'<div class="acard-thumb-txt" style="background:linear-gradient(135deg,'+(e.color||'#333')+','+(e.color2||'#555')+');color:rgba(255,255,255,0.85)">'+initials(e.artist||e.song)+'</div>';
return '<div class="acard '+(e.status==='queue'?'':e.status)+'">'
+'<div class="acard-top">'
+'<div class="acard-left">'+thumbHtmlAdmin
+'<div class="acard-text"><div class="acard-pos">'+(e.status==='queue'?'#'+qp:'')+'<span class="abadge '+bc+'">'+bl+'</span></div>'
+'<div class="acard-name">'+e.name+'</div>'
+'<div class="acard-song">'+e.song+(e.artist?' — '+e.artist:'')+'</div></div></div>'
+'<div class="acard-btns">'+actionBtns+'<button class="ac-btn ac-btn-rm" onclick="removeEntry('+e.id+')">✕</button></div>'
+'</div></div>';
}).join('');
}

function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}

renderTab('artists');
</script>
